<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  
  <!-- Favicon - multiple sizes for different browsers -->
  <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/web-app-manifest-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/icons/web-app-manifest-512x512.png" />
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tassel Hair & Beauty Studio - Online Booking and Shop" />
  <meta name="theme-color" content="#9a8060" />

  <!-- PWA Meta Tags - CRITICAL for install prompt -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tassel Studio">
  
  <!-- Apple Touch Icon - use your highest quality image -->
  <link rel="apple-touch-icon" sizes="512x512" href="/assets/icons/web-app-manifest-512x512.png">
  
  <!-- PWA Manifest - CRITICAL for install prompt -->
  <link rel="manifest" href="/manifest.json">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Jost:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <title>Tassel Hair & Beauty Studio</title>

  <!-- Handle SPA routing for GitHub Pages -->
  <script>
    (function () {
      var redirect = sessionStorage.getItem('redirect');
      if (redirect) {
        sessionStorage.removeItem('redirect');
        var base = '/tasselhairbeauty_front';
        var newPath = base + redirect;
        if (window.location.pathname !== newPath) {
          window.history.replaceState(null, '', newPath);
        }
      }
      sessionStorage.removeItem('redirecting');
    })();
  </script>

  <!-- PWA Install Detection -->
  <script>
    window.addEventListener('appinstalled', function () {
      console.log('✅ Tassel Studio PWA installed!');
    });

    if (window.matchMedia('(display-mode: standalone)').matches) {
      console.log('📱 Running as installed PWA');
      document.documentElement.classList.add('pwa-standalone');
    }
  </script>

  <style>
    .pwa-standalone {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
  </style>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>

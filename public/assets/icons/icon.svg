<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9a8060;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a18;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)" />
  
  <!-- Large T letter -->
  <text x="256" y="300" 
        font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" 
        font-size="320" 
        font-weight="600" 
        fill="white" 
        text-anchor="middle"
        dominant-baseline="middle">T</text>
  
  <!-- Gold accent line -->
  <line x1="140" y1="350" x2="372" y2="350" 
        stroke="#c4a97d" 
        stroke-width="4" 
        stroke-linecap="round" />
  
  <!-- Studio text -->
  <text x="256" y="400"
        font-family="'Jost', Arial, sans-serif"
        font-size="22"
        font-weight="400"
        fill="#c4a97d"
        text-anchor="middle"
        letter-spacing="6">STUDIO</text>
</svg>